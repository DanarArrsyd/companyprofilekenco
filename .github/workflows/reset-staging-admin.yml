name: Reset Staging Admin Password

on:
  workflow_dispatch: {}

jobs:
  reset-password:
    name: Reset staging admin password
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      - name: Add staging host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.STAGING_PORT }}" "${{ secrets.STAGING_HOST }}" >> ~/.ssh/known_hosts

      - name: Reset and verify password with Laravel Tinker
        env:
          STAGING_ADMIN_RESET_PASSWORD: ${{ secrets.STAGING_ADMIN_RESET_PASSWORD }}
        run: |
          test -n "$STAGING_ADMIN_RESET_PASSWORD"
          encoded_password="$(printf '%s' "$STAGING_ADMIN_RESET_PASSWORD" | base64 | tr -d '\n')"
          ssh -p "${{ secrets.STAGING_PORT }}" "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}" \
            "cd '${{ secrets.STAGING_PATH }}/application' && STAGING_ADMIN_RESET_PASSWORD_B64='$encoded_password' /opt/alt/php83/usr/bin/php artisan tinker --execute='\$user = App\\Models\\User::where(\"email\", \"admin@kenco.test\")->firstOrFail(); \$password = base64_decode(getenv(\"STAGING_ADMIN_RESET_PASSWORD_B64\"), true); throw_unless(is_string(\$password) && strlen(\$password) >= 16); \$user->password = \$password; \$user->save(); throw_unless(Illuminate\\Support\\Facades\\Hash::check(\$password, \$user->fresh()->password)); echo \"Reset complete: \".\$user->email.PHP_EOL;'"

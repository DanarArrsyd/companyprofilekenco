name: Deploy to Staging

# Manual trigger only, deliberately — this is the first deployment phase for
# this project and the staging pipeline has not been proven reliable yet.
# Once several manual runs have gone cleanly, revisit switching this to
# `on: push: branches: [main]` in a later phase.
#
# This workflow deploys to staging.kencomanufactur.co.id ONLY. It has no
# knowledge of, and no path anywhere near, the production document root.
on:
  workflow_dispatch: {}

jobs:
  deploy-staging:
    name: Build and deploy to staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3 (for composer.lock validation only — vendor/ is installed server-side, not shipped)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Validate composer files
        run: composer validate --no-check-publish

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Copy .env for frontend build (VITE_APP_NAME)
        run: cp .env.example .env

      - name: Build frontend assets
        run: npm run build

      - name: Load SSH deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      # Hostinger's SSH sometimes closes new connections before login (seen
      # 2026-09-29 03:56–04:13 UTC at random steps). So: every SSH use below
      # goes through ONE multiplexed connection (the `staging` host alias), and
      # only connection set-up is retried — the deploy script itself runs once.
      - name: Open one SSH connection to staging (with retries)
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat >> ~/.ssh/config <<CONFIG
          Host staging
            HostName ${STAGING_HOST}
            Port ${STAGING_PORT}
            User ${STAGING_USER}
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 20m
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 4
          CONFIG
          chmod 600 ~/.ssh/config

          for attempt in 1 2 3 4 5; do
            if keys="$(ssh-keyscan -T 20 -p "$STAGING_PORT" "$STAGING_HOST" 2>/dev/null)" && [ -n "$keys" ]; then
              echo "$keys" >> ~/.ssh/known_hosts
              if ssh -o ControlMaster=yes -fN staging; then
                echo "SSH connection open (attempt $attempt)."
                exit 0
              fi
            fi
            wait_s=$((attempt * 20))
            echo "::warning::Staging SSH refused the connection (attempt $attempt/5); retrying in ${wait_s}s."
            sleep "$wait_s"
          done
          echo "::error::Could not open an SSH connection to staging after 5 attempts. Check hPanel → SSH Access / blocked IPs."
          exit 1

      - name: Sync release to staging "incoming" directory
        run: |
          # rsync is safe to repeat; retry only when the SSH transport drops (exit 255).
          for attempt in 1 2 3; do
            set +e
            rsync -az --delete \
              -e "ssh" \
              --exclude ".git" \
              --exclude "node_modules" \
              --exclude "tests" \
              --exclude ".env" \
              --exclude "storage" \
              --exclude "public/storage" \
              ./ "staging:${{ secrets.STAGING_PATH }}/incoming/"
            code=$?
            set -e
            [ "$code" -eq 0 ] && exit 0
            [ "$code" -ne 255 ] && exit "$code"
            echo "::warning::SSH dropped during rsync (attempt $attempt/3); reopening."
            ssh -O exit staging 2>/dev/null || true
            sleep $((attempt * 20))
            ssh -o ControlMaster=yes -fN staging || true
          done
          exit 255

      - name: Run remote deploy script
        # Never retried: the script must not run twice. It also renders the key
        # pages in-process (artisan app:smoke) and fails the deploy if one errors.
        run: |
          ssh staging "DEFER_PUBLIC_HEALTH_CHECK=1 bash ${{ secrets.STAGING_PATH }}/incoming/scripts/deploy-staging.sh"

      - name: Smoke test (public URLs)
        # The server already proved every key page renders. Here the public
        # route is checked through the CDN; Hostinger's edge sometimes answers
        # GitHub runners with 403 even when the site is fine, so a 403 is a
        # warning, while 5xx or no answer fails the run.
        run: |
          base=https://staging.kencomanufactur.co.id
          ua="Mozilla/5.0 (compatible; KencoDeploySmoke/1.0; +https://github.com/DanarArrsyd/companyprofilekenco)"
          blocked=0
          for path in /up / /admin/login /products /news /contact /sitemap.xml /robots.txt; do
            status=000
            for attempt in 1 2 3; do
              status="$(curl -sS -o /dev/null -w '%{http_code}' -A "$ua" --max-time 20 "$base$path")" || status=000
              [ "$status" -ge 200 ] && [ "$status" -lt 400 ] && break
              sleep 5
            done
            echo "$status $path"
            if [ "$status" = "403" ]; then
              blocked=$((blocked + 1))
            elif ! [ "$status" -ge 200 ] 2>/dev/null || [ "$status" -ge 400 ]; then
              echo "::error::$path answered $status"
              exit 1
            fi
          done
          if [ "$blocked" -gt 0 ]; then
            echo "::warning::The CDN answered 403 to this runner for $blocked page(s); the in-process smoke check on the server passed."
          fi

      - name: Close SSH connection
        if: always()
        run: ssh -O exit staging 2>/dev/null || true
